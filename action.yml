name: "Ripple — PR risk gate"
description: "Block risky pull requests by blast radius. Annotate affected files and emit SARIF for Code Scanning."
author: alimaandev
branding:
  icon: "shield"
  color: "blue"
inputs:
  version:
    description: "Ripple npm version to run (dist-tag or exact version)"
    default: "0.7.1"
  working-directory:
    description: "Directory to run Ripple in, relative to the repository root"
    default: "."
  base:
    description: "Git ref to diff against (default: origin/main, main, HEAD~1)"
    default: ""
  gate:
    description: "Risk level that blocks the merge: medium | high | critical"
    default: "high"
  allow:
    description: "Newline-separated globs of changed files that never block the gate"
    default: ""
  annotate:
    description: "Emit workflow annotations on the PR Files tab"
    default: "true"
  upload-sarif:
    description: "Write a SARIF 2.1.0 report for Code Scanning upload"
    default: "true"
  sarif-path:
    description: "Where to write the SARIF report (relative to the workspace)"
    default: "ripple.sarif"
outputs:
  blocked:
    description: "true when the change set contains files at or above the gate"
  gate-level:
    description: "The gate level used (medium, high, critical)"
  verdict:
    description: "pass or block"
  counts:
    description: "JSON object with low/medium/high/critical file counts"
  changed-files:
    description: "Number of changed files in the change set"
  sarif-path:
    description: "Path of the SARIF report (when upload-sarif is true)"
runs:
  using: "node24"
  main: "dist/index.js"
